name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux-sdl3.yml

  windows:
    uses: ./.github/workflows/windows-sdl3.yml

  emscripten:
    uses: ./.github/workflows/emscripten-sdl3.yml

  release:
    if: github.ref == 'refs/heads/master'
    needs: [linux, windows, emscripten]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rein-sdl3-*
          path: pkg

      - name: Assemble archive
        run: |
          set -e
          test -f pkg/rein-sdl3-linux-x86_64/rein
          test -f pkg/rein-sdl3-windows-x86_64/rein.exe
          test -f pkg/rein-sdl3-emscripten/rein.html
          mkdir -p rein-sdl3/rein-em
          cp -r pkg/rein-sdl3-linux-x86_64/. rein-sdl3/
          cp pkg/rein-sdl3-windows-x86_64/rein.exe rein-sdl3/
          cp -r pkg/rein-sdl3-emscripten/. rein-sdl3/rein-em/
          zip -rq rein-sdl3.zip rein-sdl3
          unzip -l rein-sdl3.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          SHA="${{ github.sha }}"
          if gh release view continuous >/dev/null 2>&1; then
            gh release upload continuous rein-sdl3.zip --clobber
          else
            gh release create continuous rein-sdl3.zip \
              --target "$SHA" \
              --title "rein" \
              --notes "Continuous release"
          fi

      - name: Move continuous tag
        run: |
          git tag -f continuous "${{ github.sha }}"
          git push -f origin continuous
