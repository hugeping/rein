[buildPlans.IosevkaMinimal]
family = "Iosevka Minimal"
spacing = "fixed"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.IosevkaMinimal.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaMinimal.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaMinimal.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaMinimal.compatibility]
precomposed = false

[buildPlans.IosevkaMinimal.subset.include]
ranges = [
    [0x0020, 0x00FF],
    [0x0400, 0x04FF], # Cyrillic (Русский, украинский, белорусский и др.)
    [0x2000, 0x206F], # General Punctuation (Тире, кавычки, пробелы разной ширины)
    [0x2190, 0x21FF], # Arrows (Стрелочки: ←, ↑, →, ↓)
    [0x2200, 0x22FF], # Mathematical Operators (Математические знаки: ∑, ∏, √, ∞)
    [0x2300, 0x23FF], # Miscellaneous Technical (Технические символы)
    [0x2500, 0x257F], # Box Drawing (Псевдографика: рамки, линии)
    [0x2580, 0x259F], # Block Elements (Заливка блоков, пиксель-арт)
    [0x25A0, 0x25FF], # Geometric Shapes (Фигуры: квадраты, треугольники, круги)
    [0x2600, 0x26FF], # Miscellaneous Symbols (Ч/Б значки, включая базовые смайлики ☺ ☹, солнце, череп ☠)
    [0x1F600, 0x1F64F], # Emoticons (Современные эмодзи-смайлики: 😀, 😂, 😍)
    [0xE0A0, 0xE0B3]  # Powerline Symbols & Dividers (Ветка Git, замок, стрелки-разделители)
]
